<!DOCTYPE html>
<html>
<head>
    <title>Add Mock Clients</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { 
            padding: 12px 24px; 
            font-size: 16px; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            margin: 10px;
        }
        button:hover { background: #45a049; }
        .delete { background: #f44336; }
        .delete:hover { background: #da190b; }
        .result { 
            margin-top: 20px; 
            padding: 10px; 
            border-radius: 4px; 
            display: none;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>Mock Client Management</h1>
    <p>Use these buttons to add or remove mock clients for testing the board performance.</p>
    
    <button onclick="addMockClients()">Add 50 Mock Clients</button>
    <button onclick="deleteMockClients()" class="delete">Delete All Mock Clients</button>
    
    <div id="result" class="result"></div>

    <script>
        async function addMockClients() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.innerHTML = 'Adding mock clients...';
            
            try {
                const response = await fetch('/api/seed-mock-clients', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                console.log('Response:', data); // Debug log
                
                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>Success!</strong> ${data.message}<br>
                        <strong>Distribution:</strong><br>
                        ${Object.entries(data.distribution).map(([status, count]) => 
                            `${status}: ${count} clients`
                        ).join('<br>')}
                        <br><br>
                        <strong>Go refresh your board to see the clients!</strong>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<strong>Error:</strong> ${data.error}`;
                }
            } catch (error) {
                console.error('Fetch error:', error); // Debug log
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>Error:</strong> ${error.message}`;
            }
        }
        
        async function deleteMockClients() {
            if (!confirm('Are you sure you want to delete all mock clients?')) {
                return;
            }
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.innerHTML = 'Deleting mock clients...';
            
            try {
                const response = await fetch('/api/seed-mock-clients', {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `<strong>Success!</strong> ${data.message}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<strong>Error:</strong> ${data.error}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>Error:</strong> ${error.message}`;
            }
        }
    </script>
</body>
</html>
